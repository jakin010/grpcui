<div class="grpcui" id="grpcui">
  <header class="gu-topbar">
    <button type="button" class="btn btn-ghost btn-icon btn-sm" id="gu-sidebar-toggle" aria-label="Toggle sidebar" data-tooltip="Toggle sidebar"><span data-icon="panel-left"></span></button>
    <div class="gu-brand"><span class="gu-logo"><span data-icon="layers" data-size="16"></span></span><span class="gu-brand-text">gRPC UI</span></div>
    {{- if .Target }}
    <span class="badge badge-outline gu-target" data-tooltip="Connected to {{ .Target }}"><span class="gu-dot"></span><span class="mono">{{ .Target }}</span></span>
    {{- end }}
    <nav class="gu-breadcrumb" id="gu-breadcrumb" aria-label="Selected method"></nav>
    <div class="gu-spacer"></div>
    <div class="input-group gu-timeout" data-tooltip="Timeout in seconds. Leave empty for none.">
      <span class="input-icon" data-icon="clock" data-size="14"></span>
      <input id="gu-timeout" class="input input-sm mono" inputmode="decimal" placeholder="Timeout" aria-label="Timeout in seconds" autocomplete="off" spellcheck="false">
      <span class="input-suffix">s</span>
    </div>
    <button type="button" class="btn btn-primary btn-sm" id="gu-invoke" disabled>
      <span data-icon="play" data-size="14"></span><span id="gu-invoke-label">Invoke</span><kbd class="kbd gu-invoke-kbd" data-kbd="enter"></kbd>
    </button>
    <button type="button" class="btn btn-ghost btn-icon btn-sm" id="gu-history-btn" aria-label="History" data-tooltip="History"><span data-icon="history"></span></button>
    <button type="button" class="btn btn-ghost btn-icon btn-sm" id="gu-theme-btn" aria-label="Theme" data-tooltip="Theme"><span data-icon="sun"></span></button>
  </header>

  <div class="gu-body">
    <aside class="gu-sidebar" id="gu-sidebar" aria-label="Services">
      <div class="gu-sidebar-head">
        <div class="input-group">
          <span class="input-icon" data-icon="search" data-size="14"></span>
          <input id="gu-search" class="input input-sm" type="search" placeholder="Search methods" autocomplete="off" spellcheck="false" aria-label="Search methods">
          <kbd class="kbd input-suffix" data-kbd="k"></kbd>
        </div>
        <button type="button" class="gu-global-row" id="gu-global-md">
          <span data-icon="globe" data-size="14"></span><span>Global metadata</span><span class="badge badge-secondary" id="gu-global-count" hidden></span>
        </button>
      </div>
      <div class="gu-tree" id="gu-tree" role="tree" aria-label="Services and methods"></div>
    </aside>
    <div class="gu-scrim" id="gu-scrim"></div>

    <main class="gu-main">
      <div class="gu-main-grid">
        <section class="gu-panel gu-request" aria-label="Request">
          <div class="gu-panel-head">
            <h2 class="gu-panel-title">Request</h2>
            <div class="tabs-list" role="tablist" id="gu-req-tabs" aria-label="Request view">
              <button type="button" role="tab" class="tab" data-tab="form" aria-selected="true">Form</button>
              <button type="button" role="tab" class="tab" data-tab="json" aria-selected="false">JSON</button>
              <button type="button" role="tab" class="tab" data-tab="grpcurl" aria-selected="false">grpcurl</button>
            </div>
            <div class="gu-spacer"></div>
            <button type="button" class="btn btn-outline btn-sm" id="gu-examples-btn" hidden><span data-icon="braces" data-size="14"></span>Examples<span data-icon="chevron-down" data-size="14"></span></button>
          </div>
          <div class="gu-panel-body" id="gu-req-body">
            <div id="gu-method-card"></div>
            <div id="gu-metadata"></div>
            <div role="tabpanel" data-panel="form">
              <div id="gu-form" class="gu-form"></div>
            </div>
            <div role="tabpanel" data-panel="json" hidden>
              <div class="gu-toolbar">
                <span class="muted text-sm">Edit the request as JSON. The form updates when you leave the editor.</span>
                <div class="gu-spacer"></div>
                <button type="button" class="btn btn-ghost btn-xs" id="gu-json-format">Format</button>
                <button type="button" class="btn btn-ghost btn-xs" id="gu-json-copy"><span data-icon="copy" data-size="13"></span>Copy</button>
              </div>
              <textarea id="gu-raw" class="input code-input" spellcheck="false" aria-label="Request JSON"></textarea>
            </div>
            <div role="tabpanel" data-panel="grpcurl" hidden>
              <div class="gu-toolbar">
                <span class="muted text-sm">The same call from the command line, including metadata.</span>
                <div class="gu-spacer"></div>
                <button type="button" class="btn btn-ghost btn-xs" id="gu-curl-copy"><span data-icon="copy" data-size="13"></span>Copy</button>
              </div>
              <pre id="gu-grpcurl" class="code"></pre>
            </div>
          </div>
        </section>

        <section class="gu-panel gu-response" aria-label="Response">
          <div class="gu-panel-head">
            <h2 class="gu-panel-title">Response</h2>
            <div class="gu-resp-status" id="gu-resp-status" aria-live="polite"></div>
            <div class="gu-spacer"></div>
            <button type="button" class="btn btn-ghost btn-xs" id="gu-resp-copy" hidden><span data-icon="copy" data-size="13"></span>Copy</button>
          </div>
          <div class="gu-panel-body" id="gu-response"></div>
        </section>
      </div>
    </main>
  </div>
</div>

<datalist id="grpc-message-types"></datalist>

<script type="application/javascript">
initGRPCForm({{ .Config }});
</script>
