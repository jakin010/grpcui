<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ if .Target }}{{ .Target }} · {{ end }}gRPC UI</title>
    <link rel="icon" type="image/png" href="favicon.png">

    <script>
    // Apply the saved theme before the page paints, so there's no flash.
    (function() {
      try {
        var t = localStorage.getItem("grpcui-theme");
        if (t === "light" || t === "dark") {
          document.documentElement.setAttribute("data-theme", t);
        }
      } catch (e) {}
    })();

    // Send the CSRF token with every request the form makes.
    (function() {
      var match = document.cookie.match(/(?:^|;\s*)_grpcui_csrf_token=([^;]*)/);
      var token = match ? match[1] : "";
      window.grpcui = {
        requestHeaders: function() {
          return {"x-grpcui-csrf-token": token};
        }
      };
    })();
    </script>

    <link rel="stylesheet" href="grpc-web-form.css">
    <script src="grpc-web-form.js"></script>
    <style>
      html, body { margin: 0; padding: 0; }
      body { background: hsl(var(--background)); }
    </style>
    {{ range .AddlResources }}
      {{ . }}
    {{ end }}
  </head>
  <body>
    {{.WebFormContents}}
  </body>
</html>
