name: Release

# Two ways to cut a release; both build the same binaries and attach them to
# a GitHub release:
#
# 1. Push a version tag. The release is built from the tagged commit:
#      git tag -a v1.2.3 -m "Release v1.2.3"
#      git push origin v1.2.3
#
# 2. Run this workflow by hand (Actions > Release > Run workflow) with a
#    version. It creates and pushes the tag itself, and can do a dry run.
#    That tag is pushed with the automatic GITHUB_TOKEN, and pushes made with
#    that token don't trigger workflows, so it doesn't start a second run.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, sem-ver format: vM.N.P"
        required: true
        type: string
      dry_run:
        description: "Build everything, publish nothing (aka DRY-RUN... no tag, no GitHub release)"
        type: boolean
        default: false

# Only one release may be in flight at a time.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Build binaries and create the GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and the release
    outputs:
      version: ${{ steps.params.outputs.version }}
      dry_run: ${{ steps.params.outputs.dry_run }}
    steps:
      # A pushed tag is the version. A manual run takes it from the inputs.
      # Values go through env, never straight into the script, so they can't
      # inject shell code.
      - name: Work out the version
        id: params
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [[ "$EVENT" == "push" ]]; then
            version="$REF_NAME"
            dry_run=false
          else
            version="$INPUT_VERSION"
            dry_run="$INPUT_DRY_RUN"
          fi
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$version' is not a sem-ver version of the form vM.N.P" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          # goreleaser needs full history (and existing tags) to compute the change log
          fetch-depth: 0

      - name: Check that the tag does not already exist
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          VERSION: ${{ steps.params.outputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::tag $VERSION already exists" >&2
            exit 1
          fi

      # A pushed tag can't be "new" in the sense above, so instead make sure it
      # hasn't been released already (e.g. the tag was deleted and pushed again).
      - name: Check that the tag has no release yet
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.params.outputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "::error::there is already a GitHub release for $VERSION; delete it first to release this tag again" >&2
            exit 1
          fi

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      # Releases are effectively immutable, so make sure we aren't shipping a broken build.
      - name: Run tests
        run: go test ./...

      - name: Create tag
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          VERSION: ${{ steps.params.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"

      - name: Push tag
        if: ${{ github.event_name == 'workflow_dispatch' && steps.params.outputs.dry_run != 'true' }}
        env:
          VERSION: ${{ steps.params.outputs.version }}
        run: git push origin "$VERSION"

      # Cross-compiles for every platform in .goreleaser.yml, then creates the
      # GitHub release with generated notes and uploads the archives.
      - name: Build and release
        run: make release GORELEASER_ARGS="${{ steps.params.outputs.dry_run == 'true' && '--skip=publish,announce' || '' }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # CHANGELOG.md is the release notes that *would* have been published,
      # which is worth eyeballing before a real release.
      - name: Upload artifacts for inspection
        if: ${{ steps.params.outputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: dry-run-dist
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.txt
            dist/CHANGELOG.md
          if-no-files-found: error

  summary:
    name: Summarize
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Dry run summary
        if: ${{ needs.release.outputs.dry_run == 'true' }}
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          {
            echo "## Dry run of $VERSION succeeded"
            echo
            echo "Nothing was published. The binaries are attached to this run as the \`dry-run-dist\` artifact."
            echo "Re-run with **dry_run** unchecked to publish."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Release summary
        if: ${{ needs.release.outputs.dry_run != 'true' }}
        env:
          VERSION: ${{ needs.release.outputs.version }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.release.outputs.version }}
        run: |
          {
            echo "## Released $VERSION"
            echo
            echo "* [GitHub release]($RELEASE_URL), with the binaries for every platform attached"
            echo
            echo "Release notes were generated from the merged PRs. Nothing else to do."
          } >> "$GITHUB_STEP_SUMMARY"
